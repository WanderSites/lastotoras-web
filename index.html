            "text": "Sí. Contamos con una piscina exterior con solarium parquizado para la temporada estival y una piscina climatizada cubierta techada habilitada durante todo el año, ideal para escapadas de otoño, invierno o días frescos a orillas del río."

        },

            "@type": "Answer",

          }
        },
        {
          "@type": "Question",
          "name": "¿Qué capacidad tienen las cabañas y con qué equipamiento cuentan?",
          "acceptedAnswer": {
            "@type": "Answer",

          }
        },

          "name": "¿A qué distancia están de Buenos Aires y cómo se llega?",
          "acceptedAnswer": {
            "@type": "Answer",

          }
        },

          "@type": "Question",
